name = "claude-for-discord"
main = "src/index.ts"
# Bounded by the workerd bundled with wrangler (1.20261006.x): a later date deploys fine but
# breaks `wrangler dev`. Regenerate runtime types (`bun run types`) after changing it.
compatibility_date = "2026-10-06"

# No kv_namespaces here, deliberately: Workers KV quotas are per *account*, and the
# discord-youtube-websub-worker on this same account already burns half the daily limit.
# All state lives in Durable Object SQLite storage, which is metered separately.

[[durable_objects.bindings]]
name = "JOB_DO"
class_name = "JobDO"

[[durable_objects.bindings]]
name = "STATE_DO"
class_name = "StateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobDO", "StateDO"]

[vars]
DISCORD_APPLICATION_ID = "1535506748742312059"
# Public half of Discord's signing keypair — safe to commit, it only verifies signatures.
DISCORD_PUBLIC_KEY = "f4321d8e9323e29c0a94732503120d0e6b23800f832534ba4873acff9cd198bd"
CLAUDE_MAX_TOKENS = "4096"
AI_DEFAULT_MODEL = "auto"
AI_MONTHLY_BUDGET_USD = "10"
AI_MAX_ANSWER_USD = "0.25"
AI_EVALUATION_BUDGET_USD = "0.50"
# Reference USD/JPY (BOJ 2026-10-07 17:00). Fixed estimate, not a live rate.
AI_USD_JPY_RATE = "158.10"

# StateDO alarms refresh the catalog daily after first use; no account-wide Cron slot needed.

# Set with `wrangler secret put` — never in this file:
#   DISCORD_BOT_TOKEN   (reading messages when walking a reply chain)
#   AI_GATEWAY_API_KEY
#   ANTHROPIC_API_KEY   (optional: manually chosen Claude models bypass Gateway)
#   ALLOWED_USER_IDS    (comma-separated; a secret only so personal Discord ids stay out of git)

[observability.logs]
enabled = true
